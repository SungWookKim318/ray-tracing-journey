name: Phase 1 Dual-Agent Review (Mock)

on:
  pull_request:
    paths:
      - 'phase-1-rtiow/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewer-rust:
    name: Claude Code (Rust 관점) - mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mock Claude Code review (Rust perspective)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          echo "=== Phase 1 / reviewer-rust (mock) ==="
          echo "PR number : ${PR_NUMBER:-<workflow_dispatch>}"
          echo "Branch    : ${BRANCH}"
          echo "Base      : ${BASE}"
          echo ""
          echo "Changed files (vs origin/${BASE}):"
          git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null \
            || echo "  (diff unavailable - likely workflow_dispatch from non-PR context)"
          echo ""
          echo "System prompt preview (first two lines):"
          echo "  > 당신은 Rust 관점에서 Phase 1 (Ray Tracing in One Weekend) 코드를 리뷰합니다."
          echo "  > 다음 항목을 중심으로 살피되 알고리즘 자체에 대한 제안은 하지 마십시오."
          echo ""

          cat > review-rust.md <<'MOCK_EOF'
          # Mock review - Phase 1 (Rust perspective)

          Placeholder produced by the mock workflow. When the real Claude Code
          CLI is wired in, this file will contain review comments focused on
          Rust ownership, lifetime, trait abstraction, and idiomatic patterns -
          without algorithm suggestions or external math library proposals.
          MOCK_EOF

          echo "Wrote review-rust.md (mock content)"

      # TODO: Uncomment this block, switch runs-on above to
      # [self-hosted, ai_agent], and remove the mock step above.
      # - name: Run Claude Code review
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: |
      #     CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')
      #     claude-code review \
      #       --files $CHANGED_FILES \
      #       --output review-rust.md \
      #       --system-prompt "$(cat <<'PROMPT'
      #     당신은 Rust 관점에서 Phase 1 (Ray Tracing in One Weekend) 코드를 리뷰합니다.
      #     다음 항목을 중심으로 살피되 알고리즘 자체에 대한 제안은 하지 마십시오.
      #
      #     - Ownership 설계의 적절성 (Box vs Arc vs 제네릭)
      #     - 불필요한 clone, alloc, 또는 lifetime 명시
      #     - trait 추상화의 idiomatic 여부 (Material, Hittable 등)
      #     - 에러 처리의 일관성 (Result, ? 사용)
      #     - naming의 Rust 컨벤션 준수 (snake_case, type 명명)
      #
      #     다음 사항은 금지됩니다.
      #     - 코드 수정안 직접 제시
      #     - 외부 수학 라이브러리(nalgebra, glam 등) 사용 제안
      #     - RT 알고리즘 측면 언급
      #     PROMPT
      #     )"

      - uses: actions/upload-artifact@v4
        with:
          name: review-rust
          path: review-rust.md

  reviewer-algorithm:
    name: Codex CLI (알고리즘 관점) - mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mock Codex CLI review (algorithm perspective)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          echo "=== Phase 1 / reviewer-algorithm (mock) ==="
          echo "PR number : ${PR_NUMBER:-<workflow_dispatch>}"
          echo "Branch    : ${BRANCH}"
          echo "Base      : ${BASE}"
          echo ""
          echo "Changed files (vs origin/${BASE}):"
          git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null \
            || echo "  (diff unavailable - likely workflow_dispatch from non-PR context)"
          echo ""
          echo "System prompt preview (first two lines):"
          echo "  > 당신은 수치 정확성 및 알고리즘 측면에서 Phase 1 코드를 리뷰합니다."
          echo "  > 다음 항목을 중심으로 살피되 Rust 관용구는 다루지 마십시오."
          echo ""

          cat > review-algorithm.md <<'MOCK_EOF'
          # Mock review - Phase 1 (algorithm perspective)

          Placeholder produced by the mock workflow. When the real Codex CLI
          is wired in, this file will contain review comments focused on
          numerical correctness: floating-point comparisons, NaN and zero-
          division risks, vector normalization safety, sampling distribution
          accuracy, and obvious RT algorithm bugs.
          MOCK_EOF

          echo "Wrote review-algorithm.md (mock content)"

      # TODO: Uncomment this block, switch runs-on above to
      # [self-hosted, ai_agent], and remove the mock step above.
      # - name: Run Codex CLI review
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')
      #     codex review \
      #       --files $CHANGED_FILES \
      #       --output review-algorithm.md \
      #       --system-prompt "$(cat <<'PROMPT'
      #     당신은 수치 정확성 및 알고리즘 측면에서 Phase 1 (Ray Tracing in One Weekend) 코드를 리뷰합니다.
      #     다음 항목을 중심으로 살피되 Rust 관용구는 다루지 마십시오.
      #
      #     - 부동소수점 비교, 0 나눗셈, NaN 가능성
      #     - 벡터 정규화 시 0-length 처리 누락
      #     - 샘플링 분포의 정확성 (cosine-weighted hemisphere, 단위 구 샘플링 등)
      #     - random 시드 사용 패턴
      #     - 명백한 RT 알고리즘 버그 (Lambertian/Metal/Dielectric scatter 식 등)
      #
      #     다음 사항은 금지됩니다.
      #     - 코드 수정안 직접 제시
      #     - "더 좋은 알고리즘" 제안 (학습자가 도서를 통해 진행 중)
      #     - Rust 관용구나 ownership 설계 언급
      #     PROMPT
      #     )"

      - uses: actions/upload-artifact@v4
        with:
          name: review-algorithm
          path: review-algorithm.md

  synthesizer:
    name: Codex CLI Synthesizer - mock
    needs: [reviewer-rust, reviewer-algorithm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review-rust
          path: ./artifacts/review-rust

      - uses: actions/download-artifact@v4
        with:
          name: review-algorithm
          path: ./artifacts/review-algorithm

      - name: Mock synthesizer
        run: |
          echo "=== Phase 1 / synthesizer (mock) ==="
          echo ""
          echo "Verifying upstream artifacts..."
          test -f ./artifacts/review-rust/review-rust.md && echo "  [ok] review-rust.md"
          test -f ./artifacts/review-algorithm/review-algorithm.md && echo "  [ok] review-algorithm.md"
          echo ""
          echo "--- review-rust.md ---"
          cat ./artifacts/review-rust/review-rust.md
          echo ""
          echo "--- review-algorithm.md ---"
          cat ./artifacts/review-algorithm/review-algorithm.md
          echo ""
          echo "--- Mock synthesized output ---"
          echo "## Agreed (both reviewers flagged)"
          echo "(none - mock run)"
          echo ""
          echo "## Single-reviewer observations"
          echo "[Claude only] mock placeholder from review-rust"
          echo "[Codex only]  mock placeholder from review-algorithm"
          echo ""
          echo "## Conflicts (learner decision required)"
          echo "(none - mock run)"
          echo ""
          echo "Mock dual-agent review completed - real agent calls are commented out below"

      - name: Post mock synthesized review to PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > mock-comment.md <<'COMMENT_EOF'
          **Mock Dual-Agent Review (Phase 1)**

          Placeholder comment produced by the mock workflow. After activation,
          the real synthesized review from Codex CLI will replace this content.

          ## Agreed (both reviewers flagged)
          (none - mock run)

          ## Single-reviewer observations
          - [Claude only] mock placeholder from review-rust
          - [Codex only]  mock placeholder from review-algorithm

          ## Conflicts (learner decision required)
          (none - mock run)

          ---
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_EOF
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file mock-comment.md

      # TODO: Uncomment this block, switch runs-on above to
      # [self-hosted, ai_agent], and remove the mock steps above.
      # - name: Run Codex CLI synthesizer
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     codex synthesize \
      #       --inputs ./artifacts/review-rust/review-rust.md \
      #                ./artifacts/review-algorithm/review-algorithm.md \
      #       --output synthesized.md \
      #       --system-prompt "$(cat <<'PROMPT'
      #     당신은 두 AI 리뷰어의 코드 리뷰 결과를 통합하는 정리자입니다.
      #     코드 자체를 리뷰하지 마십시오. 두 입력 리뷰만을 분석합니다.
      #
      #     다음 세 카테고리로 출력을 구성하십시오.
      #
      #     ## Agreed (both reviewers flagged)
      #     두 리뷰어가 같은 또는 매우 유사한 지적을 한 항목.
      #     하나의 통합된 코멘트로 정리하되 원본의 핵심 표현은 보존합니다.
      #
      #     ## Single-reviewer observations
      #     한 리뷰어만 지적한 항목. 원본을 그대로 인용하고
      #     [Claude only] 또는 [Codex only] 태그를 붙입니다.
      #     학습자 판단이 필요한 회색 지대임을 명시합니다.
      #
      #     ## Conflicts (learner decision required)
      #     같은 코드에 대해 서로 다른 또는 반대되는 제안을 한 항목.
      #     두 의견을 나란히 인용하고 [Conflict] 태그를 붙입니다.
      #     어느 쪽이 옳다는 판단은 절대 하지 마십시오.
      #     이 영역은 학습자가 trade-off를 명시적으로 판단해야 하는 학습 지점입니다.
      #
      #     규칙:
      #     - 새 의견을 추가하지 마십시오
      #     - 리뷰어들의 표현을 가능한 한 보존하십시오
      #     - 통합을 위해 의미를 변경하지 마십시오
      #     - 학습자에게 "어느 쪽을 따르라" 식의 지시 금지
      #     PROMPT
      #     )"
      # - name: Post synthesized review to PR
      #   if: github.event_name == 'pull_request'
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh pr comment ${{ github.event.pull_request.number }} --body-file synthesized.md
