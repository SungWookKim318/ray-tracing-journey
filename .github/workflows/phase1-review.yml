name: Phase 1 Dual-Agent Review

on:
  pull_request:
    paths:
      - 'phase-1-rtiow/**'
      - '!phase-1-rtiow/AGENTS.md'
      - '!phase-1-rtiow/CLAUDE.md'
  workflow_dispatch:

concurrency:
  group: phase-1-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  reviewer-rust:
    name: Claude Code (Rust 관점)
    runs-on: [self-hosted, ai_agent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review (Rust perspective)
        env:
          BASE: ${{ github.base_ref || 'main' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set" >&2
            exit 1
          fi
          claude auth status || true

          DIFF=$(git diff "origin/${BASE}...HEAD" -- phase-1-rtiow 2>/dev/null || true)
          if [ -z "$DIFF" ]; then
            echo "No diff available (likely workflow_dispatch from a non-PR context). Writing empty review."
            printf '# Claude Code review - Phase 1 (Rust perspective)\n\n(diff was empty or unavailable; nothing to review)\n' > review-rust.md
            exit 0
          fi

          SYSTEM_PROMPT=$(cat <<'SYS'
          당신은 Rust 관점에서 Phase 1 (Ray Tracing in One Weekend) 코드를 리뷰합니다.
          다음 항목을 중심으로 살피되 알고리즘 자체에 대한 제안은 하지 마십시오.

          - Ownership 설계의 적절성 (Box vs Arc vs 제네릭)
          - 불필요한 clone, alloc, 또는 lifetime 명시
          - trait 추상화의 idiomatic 여부 (Material, Hittable 등)
          - 에러 처리의 일관성 (Result, ? 사용)
          - naming의 Rust 컨벤션 준수 (snake_case, type 명명)

          다음 사항은 금지됩니다.
          - 코드 수정안 직접 제시
          - 외부 수학 라이브러리(nalgebra, glam 등) 사용 제안
          - RT 알고리즘 측면 언급

          출력은 review-rust.md에 그대로 들어갈 마크다운 리뷰 코멘트로만 작성하십시오.
          SYS
          )

          PROMPT="$SYSTEM_PROMPT

          아래는 이번 PR의 diff입니다 (phase-1-rtiow 하위만):

          \`\`\`diff
          $DIFF
          \`\`\`"

          claude -p "$PROMPT" --output-format text \
            --model claude-sonnet-5 --effort medium --tools "" | tee review-rust.md

      - uses: actions/upload-artifact@v4
        with:
          name: review-rust
          path: review-rust.md

  reviewer-algorithm:
    name: Claude Code (알고리즘 관점)
    runs-on: [self-hosted, ai_agent]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review (algorithm perspective)
        env:
          BASE: ${{ github.base_ref || 'main' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set" >&2
            exit 1
          fi
          claude auth status || true

          DIFF=$(git diff "origin/${BASE}...HEAD" -- phase-1-rtiow 2>/dev/null || true)
          if [ -z "$DIFF" ]; then
            echo "No diff available (likely workflow_dispatch from a non-PR context). Writing empty review."
            printf '# Claude Code review - Phase 1 (algorithm perspective)\n\n(diff was empty or unavailable; nothing to review)\n' > review-algorithm.md
            exit 0
          fi

          SYSTEM_PROMPT=$(cat <<'SYS'
          당신은 수치 정확성 및 알고리즘 측면에서 Phase 1 (Ray Tracing in One Weekend) 코드를 리뷰합니다.
          다음 항목을 중심으로 살피되 Rust 관용구는 다루지 마십시오.

          - 부동소수점 비교, 0 나눗셈, NaN 가능성
          - 벡터 정규화 시 0-length 처리 누락
          - 샘플링 분포의 정확성 (cosine-weighted hemisphere, 단위 구 샘플링 등)
          - random 시드 사용 패턴
          - 명백한 RT 알고리즘 버그 (Lambertian/Metal/Dielectric scatter 식 등)

          다음 사항은 금지됩니다.
          - 코드 수정안 직접 제시
          - "더 좋은 알고리즘" 제안 (학습자가 도서를 통해 진행 중)
          - Rust 관용구나 ownership 설계 언급

          출력은 review-algorithm.md에 그대로 들어갈 마크다운 리뷰 코멘트로만 작성하십시오.
          SYS
          )

          PROMPT="$SYSTEM_PROMPT

          아래는 이번 PR의 diff입니다 (phase-1-rtiow 하위만):

          \`\`\`diff
          $DIFF
          \`\`\`"

          claude -p "$PROMPT" --output-format text \
            --model claude-sonnet-5 --effort medium --tools "" | tee review-algorithm.md

      - uses: actions/upload-artifact@v4
        with:
          name: review-algorithm
          path: review-algorithm.md

  synthesizer:
    name: Claude Code Synthesizer
    needs: [reviewer-rust, reviewer-algorithm]
    runs-on: [self-hosted, ai_agent]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review-rust
          path: ./artifacts/review-rust

      - uses: actions/download-artifact@v4
        with:
          name: review-algorithm
          path: ./artifacts/review-algorithm

      - name: Run Claude Code synthesizer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set" >&2
            exit 1
          fi
          claude auth status || true

          REVIEW_RUST=$(cat ./artifacts/review-rust/review-rust.md)
          REVIEW_ALGORITHM=$(cat ./artifacts/review-algorithm/review-algorithm.md)

          SYSTEM_PROMPT=$(cat <<'SYS'
          당신은 두 AI 리뷰어의 코드 리뷰 결과를 통합하는 정리자입니다.
          코드 자체를 리뷰하지 마십시오. 두 입력 리뷰만을 분석합니다.

          다음 세 카테고리로 출력을 구성하십시오.

          ## Agreed (both reviewers flagged)
          두 리뷰어가 같은 또는 매우 유사한 지적을 한 항목.
          하나의 통합된 코멘트로 정리하되 원본의 핵심 표현은 보존합니다.

          ## Single-reviewer observations
          한 리뷰어만 지적한 항목. 원본을 그대로 인용하고
          [Rust reviewer only] 또는 [Algorithm reviewer only] 태그를 붙입니다.
          학습자 판단이 필요한 회색 지대임을 명시합니다.

          ## Conflicts (learner decision required)
          같은 코드에 대해 서로 다른 또는 반대되는 제안을 한 항목.
          두 의견을 나란히 인용하고 [Conflict] 태그를 붙입니다.
          어느 쪽이 옳다는 판단은 절대 하지 마십시오.
          이 영역은 학습자가 trade-off를 명시적으로 판단해야 하는 학습 지점입니다.

          규칙:
          - 새 의견을 추가하지 마십시오
          - 리뷰어들의 표현을 가능한 한 보존하십시오
          - 통합을 위해 의미를 변경하지 마십시오
          - 학습자에게 "어느 쪽을 따르라" 식의 지시 금지

          출력은 synthesized.md에 그대로 들어갈 마크다운으로만 작성하십시오.
          SYS
          )

          PROMPT="$SYSTEM_PROMPT

          --- review-rust.md (Claude Code, Rust 관점) ---
          $REVIEW_RUST

          --- review-algorithm.md (Claude Code, 알고리즘 관점) ---
          $REVIEW_ALGORITHM"

          claude -p "$PROMPT" --output-format text \
            --model claude-sonnet-5 --effort medium --tools "" | tee synthesized.md

      - name: Post synthesized review to PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file synthesized.md
